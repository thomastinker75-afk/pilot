name: Publish GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/test-slang-explainer.mjs
      - run: npm run build
        env:
          VITE_BASE_PATH: /pilot/
          VITE_SITE_URL: ""
      - run: npm run check:static
      - run: node scripts/check-audit-corrections.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v5
